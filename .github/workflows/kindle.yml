yaml
name: Tao anh Kindle

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cai thu vien
        run: |
          sudo apt-get update -y
          sudo apt-get install -y fonts-dejavu-core
          pip install -r requirements.txt
      - name: Tao anh
        run: python generate.py
      - name: Luu anh
        run: |
          git config user.name "kindle-bot"
          git config user.email "kindle-bot@users.noreply.github.com"
          git add kindle.png
          git commit -m "cap nhat anh" || echo "khong co gi thay doi"
          git push
